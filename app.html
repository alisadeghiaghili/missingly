        function normalizePlan(plan) {
            const normalized = String(plan || 'free').trim().toLowerCase();
            const canonical = PLAN_ALIASES[normalized] || normalized;
            return Object.hasOwn(PLAN_RANK, canonical) ? canonical : 'free';
        }

        function getCachedUser() {
            try {
                return JSON.parse(sessionStorage.getItem('deepintelligence_user'));
            } catch (error) {
                console.warn('Could not read the cached user:', error);
                return null;
            }
        }

        async function refreshCurrentUser() {
            const response = await fetch(`${backendBaseUrl}/user/status?_=${Date.now()}`, {
                headers: { 'Authorization': `Bearer ${authToken}` },
                cache: 'no-store'
            });
            if (response.status === 401 || response.status === 403) {
                sessionStorage.removeItem('deepintelligence_token');
                sessionStorage.removeItem('deepintelligence_user');
                window.location.replace('/');
                return null;
            }
            if (!response.ok) throw new Error(`User status request failed with ${response.status}`);
            const data = await response.json();
            const user = { ...(getCachedUser() || {}), ...(data.user || {}) };
            user.plan = normalizePlan(user.plan);
            sessionStorage.setItem('deepintelligence_user', JSON.stringify(user));
            return user;
        }

        async function projectFetch(path, options = {}) {
            const response = await fetch(`${backendBaseUrl}${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`,
                    ...(options.headers || {})
                }
            });
            if (response.status === 401) {
                sessionStorage.removeItem('deepintelligence_token');
                sessionStorage.removeItem('deepintelligence_user');
                window.location.replace('/');
                throw new Error('نشست شما منقضی شده است.');
            }
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.detail || 'عملیات پروژه انجام نشد.');
            return payload;
        }

        async function saveCurrentProject() {
            const currentCode = codeEditor.value;
            const prompt = promptInput.value;
            try {
                let project;
                if (activeProjectId) {
                    const data = await projectFetch(`/projects/${activeProjectId}`, {
                        method: 'PATCH',
                        body: JSON.stringify({ current_code: currentCode, prompt })
                    });
                    project = data.project;
                    activeProjectRole = project.role || activeProjectRole;
                } else {
                    const name = window.prompt('نام پروژه را وارد کنید:', 'پروژه بدون نام');
                    if (name === null) return;
                    const data = await projectFetch('/projects', {
                        method: 'POST',
                        body: JSON.stringify({ name, current_code: currentCode, prompt })
                    });
                    project = data.project;
                    activeProjectId = project.id;
                    activeProjectRole = project.role || 'owner';
                }
                setWorkStatus(`پروژه «${project.name}» در نسخه ${project.current_revision} ذخیره شد`);
                closeDisclosureMenus();
            } catch (error) {
                displayMessageBox(error.message || 'ذخیره پروژه انجام نشد.');
            }
        }

        async function loadSavedProject() {
            try {
                const data = await projectFetch('/projects');
                if (!data.projects.length) {
                    displayMessageBox('هنوز پروژه‌ای ذخیره نشده است.');
                    return;
                }
                const choices = data.projects
                    .map(project => `${project.id}: ${project.name} (نسخه ${project.current_revision})`)
                    .join('\n');
                const choice = window.prompt(`شناسه پروژه را وارد کنید:\n${choices}`);
                if (choice === null) return;
                const projectId = Number(choice.trim());
                if (!Number.isInteger(projectId) || projectId < 1) {
                    displayMessageBox('شناسه پروژه معتبر نیست.');
                    return;
                }
                const projectData = await projectFetch(`/projects/${projectId}`);
                const project = projectData.project;
                activeProjectId = project.id;
                activeProjectRole = project.role || 'owner';
                codeEditor.value = project.current_code || DEFAULT_EDITOR_CONTENT;
                promptInput.value = project.prompt || '';
                updatePreview(codeEditor.value);
                setWorkspaceState('preview');
                setWorkStatus(`پروژه «${project.name}» باز شد`);
                closeDisclosureMenus();
            } catch (error) {
                displayMessageBox(error.message || 'باز کردن پروژه انجام نشد.');
            }
        }

        async function shareCurrentProject() {
            if (!activeProjectId) {
                displayMessageBox('ابتدا پروژه را ذخیره و باز کنید.');
                return;
            }
            if (activeProjectRole !== 'owner') {
                displayMessageBox('فقط مالک پروژه می‌تواند همکار اضافه کند.');
                return;
            }
            const email = window.prompt('ایمیل کاربر ثبت‌نام‌شده را وارد کنید:');
            if (email === null || !email.trim()) return;
            const role = window.prompt('نقش همکار: editor یا viewer', 'editor');
            if (role === null) return;
            try {
                const result = await projectFetch(`/projects/${activeProjectId}/members`, {
                    method: 'POST',
                    body: JSON.stringify({ email: email.trim(), role: role.trim().toLowerCase() })
                });
                setWorkStatus(`«${result.member.email}» به‌عنوان ${result.member.role} اضافه شد`);
                closeDisclosureMenus();
            } catch (error) {
                displayMessageBox(error.message || 'افزودن همکار انجام نشد.');
            }
        }

        async function publishCurrentProject() {
            if (!activeProjectId) {
                displayMessageBox('برای انتشار، ابتدا پروژه را ذخیره کنید.');
                return;
            }
            if (activeProjectRole !== 'owner') {
                displayMessageBox('فقط مالک پروژه می‌تواند آن را منتشر کند.');
                return;
            }
            const slug = window.prompt('آدرس کوتاه اختیاری (حروف کوچک انگلیسی، عدد و -):', '');
            if (slug === null) return;
            try {
                const result = await projectFetch(`/projects/${activeProjectId}/publications`, {
                    method: 'POST',
                    body: JSON.stringify(slug.trim() ? { slug: slug.trim() } : {})

                const url = result.publication.url;
                await navigator.clipboard?.writeText(url).catch(() => {});
                displayMessageBox(`نسخه ${result.publication.revision_number} منتشر شد. لینک در کلیپ‌بورد کپی شد:\n${url}`);
                closeDisclosureMenus();

                displayMessageBox(error.message || 'انتشار انجام نشد. ابتدا نسخه جدید ذخیره کنید یا slug دیگری انتخاب کنید.');

        }

        async function loadModelOptions(userOverride = null) {
            try {
                const previousModel = modelSelect.value;
                const response = await fetch(`${backendBaseUrl}/ai/models?_=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` },
                    cache: 'no-store'
                });
                if (!response.ok) throw new Error(`Model list request failed with ${response.status}`);
                const data = await response.json();
                const providerLabel = document.getElementById('modelProviderLabel');
                if (providerLabel) providerLabel.textContent = data.provider_label ? `(${data.provider_label})` : '';
                const effectivePlan = normalizePlan(data.plan || userOverride?.plan || getCachedUser()?.plan);
                modelSelect.innerHTML = '';
                const groups = {};
                const planLabels = {
                    free: 'رایگان',
                    basic: 'بیسک',
                    standard: 'استاندارد',
                    deluxe: 'پریمیوم'
                };
                data.models.forEach(model => {
                    const requiredPlan = normalizePlan(model.required_plan || model.min_plan);
                    const locked = PLAN_RANK[effectivePlan] < PLAN_RANK[requiredPlan];
                    const groupName = planLabels[requiredPlan] || 'سایر';
                    if (!groups[groupName]) {
                        const group = document.createElement('optgroup');
                        group.label = groupName;
                        groups[groupName] = group;
                        modelSelect.appendChild(group);
                    }
                    const option = document.createElement('option');
                    option.value = model.id;
                    option.textContent = locked
                        ? `${model.label} - قفل (${planLabels[requiredPlan] || requiredPlan})`
                        : model.label;
                    option.title = locked
                        ? `برای استفاده از این مدل پلن ${planLabels[requiredPlan] || requiredPlan} لازم است.`
                        : (model.description || model.id);
                    option.disabled = locked;
                    option.dataset.available = model.available ? 'true' : 'false';
                    option.dataset.requiredPlan = requiredPlan;
                    if (locked) option.classList.add('locked-option');
                    groups[groupName].appendChild(option);
                });
                const availableOption = [...modelSelect.options].find(option => !option.disabled);
                const preferredOption = [...modelSelect.options].find(option => option.value === previousModel && !option.disabled);
                const serverDefault = [...modelSelect.options].find(option => option.value === data.default_model && !option.disabled);
                modelSelect.value = preferredOption?.value || serverDefault?.value || availableOption?.value || '';
            } catch (error) {
                console.warn('Could not load AI model list:', error);
                setWorkStatus('خطا در دریافت فهرست مدل‌ها');
            }
        }

        function applySearchReplace(responseText, currentCode) {
            const regex = /<<<<<<< SEARCH\s*([\s\S]*?)\s*=======\s*([\s\S]*?)\s*>>>>>>> REPLACE/g;
            let updatedCode = currentCode;
            const matches = [...responseText.matchAll(regex)];
            if (matches.length === 0) {
                console.warn("AI response was not in SEARCH/REPLACE format. Displaying raw response.");
                return responseText;
            }
            for (const match of matches) {
                const searchBlock = match[1].trim();
                const replaceBlock = match[2].trim();
                if (searchBlock) {
                    updatedCode = updatedCode.replace(searchBlock, replaceBlock);
                }
            }
            return updatedCode;
        }

        function findHtmlInStructuredOutput(value) {
            if (typeof value === 'string') {
                return /(?:<!doctype\s+html|<html\b|<body\b|<main\b|<section\b|<div\b)/i.test(value) ? value : '';
            }
            if (Array.isArray(value)) {
                return value.map(findHtmlInStructuredOutput).sort((a, b) => b.length - a.length)[0] || '';
            }
            if (!value || typeof value !== 'object') return '';
            const preferredKeys = ['html', 'code', 'content', 'output_text', 'response', 'text'];
            for (const key of preferredKeys) {
                const candidate = findHtmlInStructuredOutput(value[key]);
                if (candidate) return candidate;
            }
            return Object.values(value).map(findHtmlInStructuredOutput).sort((a, b) => b.length - a.length)[0] || '';
        }

        function unwrapStructuredModelOutput(fullText) {
            let candidate = fullText.replace(/^\uFEFF/, '').trim();
            for (let attempt = 0; attempt < 2; attempt += 1) {
                if (!/^[\[{\"]/.test(candidate)) break;
                try {
                    const structured = JSON.parse(candidate);
                    const extracted = findHtmlInStructuredOutput(structured);
                    if (!extracted || extracted === candidate) break;
                    candidate = extracted.trim();
                } catch (error) {
                    break;
                }
            }
            return candidate;
        }

        function extractMainHtmlDocument(fullText) {
            if (!fullText || typeof fullText !== 'string') return '';
            let contentToParse = unwrapStructuredModelOutput(fullText);
            const fencedBlocks = [...contentToParse.matchAll(/```(?:html|htm)?\s*([\s\S]*?)\s*```/gi)];
            const fencedHtml = fencedBlocks
                .map(match => match[1]?.trim() || '')
                .find(block => /(?:<!doctype\s+html|<html\b|<body\b)/i.test(block));
            if (fencedHtml) contentToParse = fencedHtml;
            let startIndex = contentToParse.toLowerCase().indexOf('<!doctype html>');
            if (startIndex === -1) startIndex = contentToParse.toLowerCase().indexOf('<html');
            if (startIndex === -1) {
                const frameworkSyntax = /(?:\bclassName\s*=|\bonClick\s*=\s*\{|\bimport\s+React\b|\bexport\s+default\b|<>|<\/\>)/i;
                if (frameworkSyntax.test(contentToParse)) return contentToParse;
                const fragmentStart = contentToParse.search(/<(?:head|body|header|main|section|div|article|nav)\b/i);
                const fragmentTags = contentToParse.match(/<\/?(?:head|body|header|main|section|div|article|nav|h1|h2|p|img|button|form|ul|ol|canvas|video|svg)\b/gi) || [];
                if (fragmentStart >= 0 && fragmentTags.length >= 2) {
                    const fragment = contentToParse.slice(fragmentStart).replace(/```\s*$/i, '').trim();
                    if (/<body\b/i.test(fragment)) {
                        return `<!DOCTYPE html>\n<html>\n${fragment}\n</html>`;
                    }
                    return `<!DOCTYPE html>\n<html>\n<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>\n<body>\n${fragment}\n</body>\n</html>`;
                }
                return contentToParse;
            }
            const htmlCloseTag = '</html>';
            let endIndex = contentToParse.toLowerCase().lastIndexOf(htmlCloseTag);
            if (endIndex > startIndex) {
                return contentToParse.substring(startIndex, endIndex + htmlCloseTag.length).trim();
            } else {
                return contentToParse.substring(startIndex).trim();
            }
        }

        function imageFallbackDataUri() {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset="0.55" stop-color="#134e4a"/><stop offset="1" stop-color="#312e81"/></linearGradient></defs><rect width="960" height="540" rx="28" fill="url(#g)"/><circle cx="210" cy="170" r="64" fill="#2dd4bf" opacity="0.22"/><path d="M150 398l170-176 126 116 86-78 278 138H150z" fill="#f8fafc" opacity="0.18"/><text x="480" y="292" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="34" font-weight="700">Image unavailable</text></svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function hardenGeneratedHtml(htmlContent) {
            const fallback = imageFallbackDataUri();
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent || '', 'text/html');
                let base = doc.head.querySelector('base');
                if (!base) {
                    base = doc.createElement('base');
                    doc.head.prepend(base);
                }
                base.setAttribute('href', `${window.location.origin}/`);
                doc.querySelectorAll('img').forEach(img => {
                    const src = (img.getAttribute('src') || '').trim();
                    if (!src || src === '#') img.setAttribute('src', fallback);
                    if (!img.getAttribute('alt')) img.setAttribute('alt', 'Generated visual');
                    if (!img.getAttribute('loading')) img.setAttribute('loading', 'lazy');
                    if (!img.getAttribute('decoding')) img.setAttribute('decoding', 'async');
                    img.style.maxWidth = img.style.maxWidth || '100%';
                    img.setAttribute('onerror', `this.onerror=null;this.src='${fallback}';`);
                });
                const script = doc.createElement('script');
                script.textContent = `document.addEventListener('error',function(event){var img=event.target;if(img&&img.tagName==='IMG'){img.onerror=null;img.src='${fallback}';}},true);`;
                doc.body.appendChild(script);
                return `<!DOCTYPE html>\n${doc.documentElement.outerHTML}`;
            } catch (error) {
                return htmlContent;
            }
        }

        function isRenderableHtml(htmlContent) {
            if (typeof htmlContent !== 'string' || htmlContent.trim().length < 20) return false;
            if (!/(?:<!doctype\s+html|<html\b)/i.test(htmlContent)) return false;
            const bodyStart = htmlContent.search(/<body\b/i);
            if (bodyStart === -1) return false;
            const bodySource = htmlContent.slice(bodyStart);
            if (!/<(?:header|main|section|div|article|nav|h1|h2|p|img|button|form|ul|ol|table|canvas|video|svg)\b/i.test(bodySource)) return false;
            if (/(?:\bclassName\s*=|\bonClick\s*=\s*\{|\bimport\s+React\b|\bexport\s+default\b|<>|<\/\>)/i.test(htmlContent)) return false;
            try {
                const doc = new DOMParser().parseFromString(htmlContent, 'text/html');
                if (!doc.body) return false;
                const visibleElements = [...doc.body.querySelectorAll('header, main, section, div, article, nav, h1, h2, p, img, button, form, ul, ol, table, canvas, video, svg')];
                return visibleElements.some(element =>
                    Boolean(
                        element.textContent.trim()
                        || element.children.length
                        || ['IMG', 'CANVAS', 'VIDEO', 'SVG'].includes(element.tagName)
                    )
                );
            } catch (error) {
                return false;
            }
        }

        function updatePreview(htmlContent, options = {}) {
            const allowFallback = options.allowFallback !== false;
            const persist = options.persist !== false;
            const candidate = isRenderableHtml(htmlContent)
                ? htmlContent
                : (allowFallback ? lastRenderablePreviewHtml : '');
            if (!isRenderableHtml(candidate)) return false;
            const hardenedHtml = hardenGeneratedHtml(candidate);
            previewFrame.removeAttribute('srcdoc');
            previewFrame.src = `data:text/html;charset=utf-8,${encodeURIComponent(hardenedHtml)}`;
            if (persist) lastRenderablePreviewHtml = candidate;
            return true;
        }

        function renderStreamingHtml(rawText) {
            if (!rawText) return false;
            const candidate = extractMainHtmlDocument(rawText)
                .replace(/^```(?:html)?\s*/i, '')
                .replace(/```\s*$/i, '')
                .trim();
            return updatePreview(candidate, { allowFallback: false, persist: false });
        }

        function streamingPreviewHtml(message, rawText) {
            return `<!DOCTYPE html>

        function updateStreamingProgress(rawText, message = 'Streaming response...') {
            const progress = document.getElementById('previewProgress');
            if (progress) progress.textContent = message || 'در حال ساخت پیش‌نمایش زنده';
        }

        function parseSseEvents(buffer) {
            const events = [];
            let boundary = buffer.indexOf('\n\n');
            while (boundary !== -1) {
                const block = buffer.slice(0, boundary);
                buffer = buffer.slice(boundary + 2);
                const lines = block.split('\n');
                let eventName = 'message';
                let data = '';
                lines.forEach(line => {
                    if (line.startsWith('event:')) eventName = line.slice(6).trim();
                    if (line.startsWith('data:')) data += line.slice(5).trim();
                });
                if (data) {
                    try {
                        events.push({ eventName, payload: JSON.parse(data) });
                    } catch (error) {
                        console.warn('Could not parse stream event:', data);
                    }
                }
                boundary = buffer.indexOf('\n\n');
            }
            return { events, buffer };
        }

        function streamErrorMessage(payload, fallbackStatus) {
            const detail = payload?.detail;
            if (typeof detail === 'object' && detail !== null) {
                if (detail.message) return detail.message;
                if (detail.provider_body) {
                    if (/gap_api_error|request failed/i.test(detail.provider_body)) {
                        return 'سرویس تولید کد موقتاً پاسخ نداد. چند لحظه صبر کنید و دوباره ارسال را بزنید.';
                    }
                    return `${detail.provider_status || fallbackStatus}: ${detail.provider_body}`;
                }
                return JSON.stringify(detail);
            }
            return detail || payload?.message || 'An unknown streaming error occurred.';
        }

        async function sendPromptToLLM() {
            const userPrompt = promptInput.value;
            const currentCode = codeEditor.value;
            const token = sessionStorage.getItem('deepintelligence_token');

            if (!token) {
                displayMessageBox("نشست شما منقضی شده است. لطفاً دوباره وارد شوید.", () => {
                    window.location.href = `${backendBaseUrl}/`;
                });
                return;
            }
            if (!userPrompt.trim()) {
                displayMessageBox("لطفاً یک پرامپت وارد کنید.");
                return;
            }

            const user = getCachedUser();
            if (user) {
                const remaining = Math.max(Number(user.request_balance || 0), 0);
                if (remaining <= 0) {
                    redirectToPricing("تعداد درخواست‌های پلن شما تمام شده است. برای ادامه یکی از پلن‌ها را انتخاب کنید.");
                    return;
                }
            }

            if (user && normalizePlan(user.plan) === 'free') {
                const wordLimit = 50;
                const wordCount = userPrompt.trim().split(/\s+/).length;
                if (wordCount > wordLimit) {
                    displayMessageBox(
                        `در پلن رایگان پرامپت نمی‌تواند بیشتر از ${wordLimit} کلمه باشد. شما ${wordCount} کلمه نوشته‌اید. لطفاً کوتاه‌ترش کنید یا پلن را ارتقا بدهید.`,
                        () => { window.location.href = '/pricing'; }
                    );
                    return;
                }
            }

            const isInitialRequest = !currentCode.trim() || currentCode.trim() === DEFAULT_EDITOR_CONTENT.trim();
            const dataToSend = {
                prompt: userPrompt,
                current_code: currentCode,
                type: isInitialRequest ? 'initial' : 'follow_up',
                model: modelSelect.value
            };

            setWorkspaceState('preview');
            codeEditor.value = '';
            codeEditor.classList.add('loading');
            updatePreview(streamingPreviewHtml('در حال اتصال به مدل...', ''));
            sendPromptBtn.disabled = true;
            modelSelect.disabled = true;
            sendPromptBtn.textContent = 'در حال ساخت...';
            setWorkStatus('در حال اتصال...');
            document.body.classList.add('is-generating');

            let rawAccumulatedResponse = '';
            let streamBuffer = '';
            let renderTimer = null;
            let lastRenderedLength = 0;
            let lastLivePreviewAt = 0;
            const scheduleStreamRender = () => {
                if (renderTimer) return;
                renderTimer = window.setTimeout(() => {
                    renderTimer = null;
                    if (lastRenderedLength === rawAccumulatedResponse.length) return;
                    lastRenderedLength = rawAccumulatedResponse.length;
                    codeEditor.value = rawAccumulatedResponse;
                    codeEditor.scrollTop = codeEditor.scrollHeight;
                    const now = Date.now();
                    if (now - lastLivePreviewAt >= 700) {
                        const rendered = renderStreamingHtml(rawAccumulatedResponse);
                        if (rendered) lastLivePreviewAt = now;
                        else updateStreamingProgress(rawAccumulatedResponse, 'در حال آماده‌سازی ساختار صفحه...');
                    }
                }, 160);
            };

            try {
                const response = await fetch(`${backendBaseUrl}/generate-code/stream`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(dataToSend)
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const detail = errorData.detail;
                    const providerMessage = typeof detail === 'object'
                        ? `${detail.provider_status || response.status}: ${detail.provider_body || JSON.stringify(detail)}`
                        : (detail || errorData.message || JSON.stringify(errorData));
                    const errorCode = errorData.error || (detail && detail.error);
                    const errorMessage = errorData.message || (detail && detail.message);
                    const redirectTo = errorData.redirect_to || (detail && detail.redirect_to);
                    if ((response.status === 402 || response.status === 403) && (errorCode === "limit_reached" || errorCode === "model_locked" || redirectTo === "/pricing")) {
                        redirectToPricing(errorMessage);
                    } else if (response.status === 401) {
                            displayMessageBox("احراز هویت ناموفق بود. لطفاً دوباره وارد شوید.", () => { window.location.href = `${backendBaseUrl}/`; });
                    } else {
                        displayMessageBox(`Error: ${providerMessage || 'An unknown error occurred.'}`);
                    }
                    codeEditor.value = currentCode;
                    setWorkspaceState(isInitialRequest ? 'empty' : 'preview');
                    return; 
                }

                if (!response.body) {
                    throw new Error('Streaming is not supported by this browser.');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let streamComplete = false;
                let streamFinishReason = null;

                while (!streamComplete) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    streamBuffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');
                    const parsed = parseSseEvents(streamBuffer);
                    streamBuffer = parsed.buffer;

                    for (const { eventName, payload } of parsed.events) {
                        if (eventName === 'status') {
                            const message = payload.message || 'Working...';
                            if (payload.reason) streamFinishReason = payload.reason;
                            setWorkStatus(message);
                            sendPromptBtn.textContent = message.length > 16 ? 'Working...' : message;
                        } else if (eventName === 'delta') {
                            rawAccumulatedResponse += payload.content || '';
                            setWorkStatus('Streaming...');
                            scheduleStreamRender();
                        } else if (eventName === 'error') {
                            const errorCode = payload?.detail?.error;
                            const redirectTo = payload?.detail?.redirect_to;
                            const errorMessage = streamErrorMessage(payload, payload?.status);
                            codeEditor.value = currentCode;
                            updatePreview(currentCode);
                            setWorkspaceState(isInitialRequest ? 'empty' : 'preview');
                            if ((payload.status === 402 || payload.status === 403) && (errorCode === 'limit_reached' || errorCode === 'model_locked' || redirectTo === '/pricing')) {
                                redirectToPricing(errorMessage);
                            } else {
                                displayMessageBox(`Error: ${errorMessage}`);
                            }
                            return;
                        } else if (eventName === 'done') {
                            streamComplete = true;
                            setWorkStatus('Finalizing...');
                        }
                    }
                }

                if (renderTimer) {
                    window.clearTimeout(renderTimer);
                    renderTimer = null;
                }
                codeEditor.classList.remove('loading');

                let finalCode = isInitialRequest
                    ? extractMainHtmlDocument(rawAccumulatedResponse)
                    : applySearchReplace(rawAccumulatedResponse, currentCode);
                if (!isInitialRequest && !isRenderableHtml(finalCode)) {
                    const completeHtmlFallback = extractMainHtmlDocument(rawAccumulatedResponse);
                    if (isRenderableHtml(completeHtmlFallback)) finalCode = completeHtmlFallback;
                }
                if (!isRenderableHtml(finalCode)) {
                    codeEditor.value = currentCode || DEFAULT_EDITOR_CONTENT;
                    updatePreview(codeEditor.value);
                    setWorkspaceState('preview');
                    const reasonText = streamFinishReason === 'length'
                        ? 'خروجی مدل به سقف طول رسید و HTML کامل نشد.'
                        : 'مدل به‌جای HTML مستقل، متن یا کد فریم‌ورکی برگرداند.';
                    displayMessageBox(`${reasonText} پیش‌نمایش قبلی حفظ شد؛ لطفاً دوباره تلاش کنید.`);
                    return;
                }
                codeEditor.value = finalCode;
                updatePreview(finalCode);
                setWorkspaceState('preview');

                await refreshCurrentUser();
                updateRequestsCounter();

            } catch (error) {
                displayMessageBox(`خطای اتصال: ${error.message}`);
                codeEditor.value = currentCode;
                updatePreview(currentCode);
                setWorkspaceState(isInitialRequest ? 'empty' : 'preview');
            } finally {
                if (renderTimer) window.clearTimeout(renderTimer);
                sendPromptBtn.disabled = false;
                modelSelect.disabled = false;
                sendPromptBtn.textContent = 'ارسال';
                setWorkStatus('آماده');
                codeEditor.classList.remove('loading');
                document.body.classList.remove('is-generating');
            }
        }
        
        let onMessageBoxClose = null;

        function displayMessageBox(message, callback) {
            messageBoxText.textContent = message;
            messageBoxOverlay.style.display = 'flex';
            onMessageBoxClose = callback || null;
        }

        messageBoxCloseBtn.addEventListener('click', () => {
            messageBoxOverlay.style.display = 'none';

                onMessageBoxClose();
                onMessageBoxClose = null;
            }
        });

        codeEditor.addEventListener('input', () => {

            if (workspaceState === 'empty') setWorkspaceState('code');
        });

            if (event.key === 'Tab' && !event.shiftKey) {
                event.preventDefault();
                const start = this.selectionStart, end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);

            }
        });

        });

        function downloadHtmlCode() {
            const codeToDownload = codeEditor.value;
            if (!codeToDownload) {
                displayMessageBox("There is no code to download.");
                return;
            }
            const blob = new Blob([codeToDownload], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = window.URL.createObjectURL(blob);
            a.download = 'index.html';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(a.href);
            document.body.removeChild(a);
        }

        downloadBtn.addEventListener('click', downloadHtmlCode);
        updatePreview(codeEditor.value);

        chatBtn.addEventListener('click', () => {
            closeDisclosureMenus();
            setWorkspaceState('code');
        });

        previewBtn.addEventListener('click', () => {
            closeDisclosureMenus();
            updatePreview(codeEditor.value || DEFAULT_EDITOR_CONTENT);
            setWorkspaceState('preview');
        });

        let isResizing = false;
        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'ew-resize';
            document.body.style.userSelect = 'none';
            dragOverlay.style.display = 'block';
        });
        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const leftPaneWidth = e.clientX;
            const minWidth = 300;
            const maxWidth = mainContentWrapper.offsetWidth - 300;
            if (leftPaneWidth > minWidth && leftPaneWidth < maxWidth) {
                leftPane.style.width = `${leftPaneWidth}px`;
            }
        });
        document.addEventListener('mouseup', () => {
            isResizing = false;
            document.body.style.cursor = 'default';
            document.body.style.userSelect = 'auto';
            dragOverlay.style.display = 'none';
        });

        // --- UPDATED: Call the counter and check for payment status on page load ---
        window.addEventListener('load', () => {
            leftPane.style.width = '50%';
            setWorkspaceState('empty');
            updatePromptDirection();
            initializeAccountAccess();
            
            // --- NEW: Check for payment success message ---
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('payment_status') === 'success') {
                displayMessageBox("پرداخت موفق بود. پلن شما ارتقا پیدا کرد.", () => {
                    // Clean the URL to prevent the message from showing on refresh
                    window.history.replaceState({}, document.title, window.location.pathname);
                });
            }
        });
