[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "missingly"
dynamic = ["version"]
authors = [
    {name = "Ali Sadeghi Aghili", email = "alisadeghiaghili@gmail.com"},
]
description = "A comprehensive package for missing data analysis and visualization."
readme = "README.md"
requires-python = ">=3.9"
license = "BUSL-1.1"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "statsmodels>=0.12.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
interactive = ["plotly>=5.0.0"]
rtl = ["arabic-reshaper>=3.0.0", "python-bidi>=0.4.2"]
all = [
    "plotly>=5.0.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "hypothesis>=6.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=0.950",
    "build>=0.7.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/alisadeghiaghili/missingly"
Documentation = "https://alisadeghiaghili.github.io/missingly/"
Repository = "https://github.com/alisadeghiaghili/missingly"
Changelog = "https://github.com/alisadeghiaghili/missingly/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["missingly", "missingly.visualisation"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
missingly = ["templates/*.html"]

[tool.setuptools.exclude-package-data]
"*" = ["docs/build/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["missingly", ".git", "__pycache__", "dist", "build", ".tox", ".venv"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::FutureWarning:sklearn",
]
