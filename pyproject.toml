[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "missingly"
dynamic = ["version"]
authors = [
  { name="Ali Sadeghi Aghili", email="alisadeghiaghili@gmail.com" },
]
description = "A comprehensive package for missing data analysis and visualization."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "jinja2>=3.1.0",
    "statsmodels>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/alisadeghiaghili/missingly"
"Bug Tracker" = "https://github.com/alisadeghiaghili/missingly/issues"
Documentation = "https://missingly.readthedocs.io"

[project.optional-dependencies]
docs = [
    "sphinx>=7.0.0",
    "furo>=2023.9.10",
    "nbsphinx>=0.9.0",
    "numpydoc>=1.6.0",
    "ipykernel",
    "pypandoc-binary>=1.15",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "upsetplot>=0.9.0",
]
interactive = [
    "plotly>=5.0.0",
]
rtl = [
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
]
upset = [
    "upsetplot>=0.9.0",
]
all = [
    "plotly>=5.0.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "upsetplot>=0.9.0",
]

[tool.setuptools]
packages = ["missingly", "missingly.visualisation"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "missingly._version.__version__"}

[tool.setuptools.package-data]
missingly = ["templates/*.html"]

[tool.setuptools.exclude-package-data]
"*" = ["docs/build/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["missingly", ".git", "__pycache__", "dist", "build", ".tox", ".venv"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::FutureWarning:sklearn",
]

[tool.coverage.run]
source = ["missingly"]
omit = ["missingly/templates/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
