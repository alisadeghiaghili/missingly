[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "missingly"
dynamic = ["version"]
authors = [
  { name="Ali Sadeghi Aghili", email="alisadeghiaghili@gmail.com" },
]
description = "A comprehensive package for missing data analysis and visualization."
readme = "README.md"
requires-python = ">=3.9"
license = "BUSL-1.1"
license-files = ["LICENSE", "NOTICE", "XeroGraph_LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.4.0",
    "jinja2>=3.1.0",
    "statsmodels>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/alisadeghiaghili/missingly"
"Bug Tracker" = "https://github.com/alisadeghiaghili/missingly/issues"
Documentation = "https://alisadeghiaghili.github.io/missingly/"
Repository = "https://github.com/alisadeghiaghili/missingly"
Changelog = "https://github.com/alisadeghiaghili/missingly/blob/main/CHANGELOG.md"

[project.optional-dependencies]
docs = [
    "sphinx>=7.0.0",
    "furo>=2023.9.10",
    "nbsphinx>=0.9.0",
    "numpydoc>=1.6.0",
    "ipykernel",
    "pypandoc-binary>=1.15",
]
test = [
    "build>=1.2.0",
    "setuptools>=77.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyyaml>=6.0",
    "upsetplot>=0.9.0",
]
quality = [
    "mypy>=1.13.0",
    "ruff>=0.12.0",
]
interactive = [
    "plotly>=5.0.0",
]
polars = [
    "polars>=1.0.0",
]
rtl = [
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
]
upset = [
    "upsetplot>=0.9.0",
]
all = [
    "plotly>=5.0.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "upsetplot>=0.9.0",
]

[tool.setuptools]
packages = ["missingly", "missingly.visualisation"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "missingly._version.__version__"}

[tool.setuptools.package-data]
missingly = ["templates/*.html"]

[tool.setuptools.exclude-package-data]
"*" = ["docs/build/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["missingly", ".git", "__pycache__", "dist", "build", ".tox", ".venv"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::FutureWarning:sklearn",
]

[tool.ruff]
target-version = "py39"
# frozen verbatim reference implementation used only as a characterisation oracle; never edited
extend-exclude = ["tests/golden/legacy_transformer.py"]

[tool.ruff.lint]
# Mirrors the rule families SonarQube reports for Python. Existing debt is
# recorded in tools/ruff_baseline.json and enforced by tools/ruff_ratchet.py.
select = [
    "E", "W", "F", "B", "BLE", "S", "N", "C90", "PL", "SIM", "ERA", "UP",
    "RUF", "NPY", "PD", "PT", "TRY", "RET", "ARG", "ISC", "DTZ", "PGH",
]

[tool.ruff.lint.per-file-ignores]
# Assertions are the test mechanism; bandit S101 does not apply to pytest.
# Test fixtures and expected values are literals; PLR2004 does not apply.
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 13
max-positional-args = 13

[tool.coverage.run]
source = ["missingly"]
omit = ["missingly/templates/*"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
