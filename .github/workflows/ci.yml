name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

  dqt-integration:
    name: DQT integration (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data-quality-toolkit from GitHub main
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/alisadeghiaghili/data-quality-toolkit.git@main

      - name: Install missingly and test dependencies
        run: |
          pip install -e ".[test]"

      - name: Verify DQT correlation_heatmap is importable
        run: |
          python - <<'EOF'
          from data_quality_toolkit.visualization import correlation_heatmap
          import inspect
          sig = inspect.signature(correlation_heatmap)
          required = {"corr"}
          missing = required - set(sig.parameters)
          assert not missing, f"Missing params in correlation_heatmap: {missing}"
          print("OK: correlation_heatmap signature is stable:", list(sig.parameters))
          EOF

      - name: Run full test suite with DQT installed
        run: |
          pytest tests/ -v --tb=short
