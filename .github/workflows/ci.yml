name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  polars:
    name: Native Polars adapter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install native Polars adapter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,polars]'

      - name: Test eager and lazy native Polars behavior
        run: pytest tests/test_polars.py -v

      - name: Execute Polars adapter docstring examples
        run: python -m doctest missingly/polars_adapter.py

  quality:
    name: Python quality baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[quality]'

      - name: Enforce the ruff lint and format ratchet
        run: python tools/ruff_ratchet.py

      - name: Check the public benchmark contract types
        run: mypy missingly/benchmark.py --follow-imports=skip --ignore-missing-imports

      - name: Execute benchmark contract docstring examples
        run: python -m doctest missingly/benchmark.py

      - name: Lint GitHub workflow files with actionlint
        run: |
          python -m pip install actionlint-py==1.7.12.25
          actionlint

  test:
    name: pytest (Python ${{ matrix.python-version }})
    # ubuntu-latest moved to 26.04, which has no Python 3.9 build for
    # actions/setup-python. 24.04 keeps every version in the matrix available.
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('missingly/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y missingly || true
          pip install -e '.[test,all]'

      - name: Verify public API is importable
        run: |
          python - <<'PYEOF'
          import missingly
          assert callable(missingly.add_any_miss_var), 'add_any_miss_var missing'
          assert callable(missingly.bind_shadow_matrix), 'bind_shadow_matrix missing'
          print('OK: public API check passed')
          PYEOF

      - name: Run pytest with coverage
        run: pytest tests/ -v --tb=short --cov=missingly --cov-branch --cov-report=xml --cov-report=term-missing

      - name: Retain Python 3.12 coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: coverage-py312
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  package:
    name: Compile and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Compile package
        run: python -m compileall -q missingly

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

  docs:
    name: Build documentation with warnings as errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[docs]'

      - name: Build HTML documentation
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html
