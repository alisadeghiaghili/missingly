name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('missingly/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install data-quality-toolkit from GitHub
        run: pip install git+https://github.com/alisadeghiaghili/data-quality-toolkit.git@main

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall --no-deps -e '.[test]'
          pip install statsmodels

      - name: Verify public API is importable
        run: |
          python - <<'PYEOF'
          import missingly
          assert callable(missingly.add_any_miss_var), 'add_any_miss_var missing'
          assert callable(missingly.bind_shadow_matrix), 'bind_shadow_matrix missing'
          print('OK: public API check passed')
          PYEOF

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  dqt-integration:
    name: DQT integration (correlation_heatmap contract)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout missingly
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data-quality-toolkit (latest main)
        run: pip install git+https://github.com/alisadeghiaghili/data-quality-toolkit.git@main

      - name: Install missingly and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall --no-deps -e '.[test]'
          pip install statsmodels

      - name: Verify correlation_heatmap contract
        run: |
          python - <<'PYEOF'
          import sys
          import numpy as np
          import pandas as pd
          import matplotlib
          matplotlib.use('Agg')
          try:
              from data_quality_toolkit.visualization import correlation_heatmap
          except ImportError as e:
              print(f'FAIL: cannot import correlation_heatmap from DQT: {e}')
              sys.exit(1)
          rng = np.random.default_rng(42)
          df = pd.DataFrame(rng.standard_normal((20, 3)), columns=['a', 'b', 'c'])
          try:
              correlation_heatmap(df.corr())
          except Exception as e:
              print(f'FAIL: correlation_heatmap raised {type(e).__name__}: {e}')
              sys.exit(1)
          print('OK: DQT.correlation_heatmap contract verified.')
          PYEOF

      - name: Run DQT-integration tests
        run: pytest tests/test_dqt_integration.py -v --tb=short
