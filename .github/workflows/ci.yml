name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  polars:
    name: Native Polars adapter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native Polars adapter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,polars]'

      - name: Test eager and lazy native Polars behavior
        run: pytest tests/test_polars.py -v

      - name: Execute Polars adapter docstring examples
        run: python -m doctest missingly/polars_adapter.py

  quality:
    name: Python quality baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[quality]'

      - name: Reject Python syntax and undefined-name defects
        run: ruff check missingly tests

      - name: Check the public benchmark contract types
        run: mypy missingly/benchmark.py --follow-imports=skip --ignore-missing-imports

      - name: Execute benchmark contract docstring examples
        run: python -m doctest missingly/benchmark.py

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('missingly/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y missingly || true
          pip install -e '.[test,all]'

      - name: Verify public API is importable
        run: |
          python - <<'PYEOF'
          import missingly
          assert callable(missingly.add_any_miss_var), 'add_any_miss_var missing'
          assert callable(missingly.bind_shadow_matrix), 'bind_shadow_matrix missing'
          print('OK: public API check passed')
          PYEOF

      - name: Run pytest with coverage
        run: pytest tests/ -v --tb=short --cov=missingly --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Retain Python 3.12 coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-py312
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  package:
    name: Compile and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Compile package
        run: python -m compileall -q missingly

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

  docs:
    name: Build documentation with warnings as errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[docs]'

      - name: Build HTML documentation
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html
