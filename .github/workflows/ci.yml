name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile application
        run: python -m compileall -q main.py tools tests
      - name: Run test suite
        run: pytest -q
      - name: Build safe release archive
        run: python tools/build_release.py
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: missingly-release
          path: .artifacts/missingly-release.zip
          if-no-files-found: error
