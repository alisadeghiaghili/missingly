name: Reproduce R statistical oracle

on:
  pull_request:
    paths:
      - "tests/fixtures/little_mcar/**"
      - ".github/workflows/r-oracle.yml"
  push:
    branches: [main]
    paths:
      - "tests/fixtures/little_mcar/**"
      - ".github/workflows/r-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  little-mcar-oracle:
    name: Regenerate Little MCAR oracle with R
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"

      - name: Install locked oracle dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            github::njtierney/naniar@v1.1.0
            any::jsonlite
          # ``all`` includes optional Suggests dependencies. The oracle uses only
          # naniar::mcar_test, so install reproducible hard runtime dependencies.
          dependencies: '"hard"'

      - name: Record fixture and script identities
        run: |
          echo "DATASET_SHA256=$(sha256sum tests/fixtures/little_mcar/airquality.csv | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "REFERENCE_SCRIPT_SHA256=$(sha256sum tests/fixtures/little_mcar/generate_naniar_reference.R | cut -d ' ' -f1)" >> "$GITHUB_ENV"

      - name: Generate R reference evidence
        run: |
          mkdir -p r-reference-artifact
          Rscript tests/fixtures/little_mcar/generate_naniar_reference.R \
            tests/fixtures/little_mcar/airquality.csv \
            r-reference-artifact/naniar_little_mcar_reference.json

      - name: Validate R evidence against the committed numerical oracle
        run: |
          python tests/fixtures/little_mcar/validate_naniar_reference.py \
            r-reference-artifact/naniar_little_mcar_reference.json \
            tests/fixtures/little_mcar/benchmark_manifest.json

      - name: Upload locked R reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: naniar-little-mcar-reference
          path: r-reference-artifact/naniar_little_mcar_reference.json
          if-no-files-found: error
