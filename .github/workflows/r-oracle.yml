name: Reproduce R statistical oracle

on:
  pull_request:
    paths:
      - "tests/fixtures/little_mcar/**"
      - "tests/fixtures/mice_numeric_fcs/**"
      - "missingly/**"
      - ".github/workflows/r-oracle.yml"
  push:
    branches: [main]
    paths:
      - "tests/fixtures/little_mcar/**"
      - "tests/fixtures/mice_numeric_fcs/**"
      - "missingly/**"
      - ".github/workflows/r-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  little-mcar-oracle:
    name: Regenerate Little MCAR oracle with R
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          r-version: "4.4.2"

      - name: Install locked oracle dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          packages: |
            github::njtierney/naniar@v1.1.0
            any::jsonlite
          # ``all`` includes optional Suggests dependencies. The oracle uses only
          # naniar::mcar_test, so install reproducible hard runtime dependencies.
          dependencies: '"hard"'

      - name: Record fixture and script identities
        run: |
          echo "DATASET_SHA256=$(sha256sum tests/fixtures/little_mcar/airquality.csv | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "REFERENCE_SCRIPT_SHA256=$(sha256sum tests/fixtures/little_mcar/generate_naniar_reference.R | cut -d ' ' -f1)" >> "$GITHUB_ENV"

      - name: Generate R reference evidence
        run: |
          mkdir -p r-reference-artifact
          Rscript tests/fixtures/little_mcar/generate_naniar_reference.R \
            tests/fixtures/little_mcar/airquality.csv \
            r-reference-artifact/naniar_little_mcar_reference.json

      - name: Validate R evidence against the committed numerical oracle
        run: |
          python tests/fixtures/little_mcar/validate_naniar_reference.py \
            r-reference-artifact/naniar_little_mcar_reference.json \
            tests/fixtures/little_mcar/benchmark_manifest.json

      - name: Upload locked R reference artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: naniar-little-mcar-reference
          path: r-reference-artifact/naniar_little_mcar_reference.json
          if-no-files-found: error

  mice-numeric-fcs-evidence:
    name: Generate R mice numeric FCS evidence
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          r-version: "4.4.2"

      - name: Install locked oracle dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          packages: |
            cran::mice@3.19.0
            any::jsonlite
          dependencies: '"hard"'

      - name: Record fixture and script identities
        run: |
          echo "DATASET_SHA256=$(sha256sum tests/fixtures/mice_numeric_fcs/numeric_fcs.csv | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "REFERENCE_SCRIPT_SHA256=$(sha256sum tests/fixtures/mice_numeric_fcs/generate_mice_reference.R | cut -d ' ' -f1)" >> "$GITHUB_ENV"

      - name: Generate R mice evidence
        run: |
          mkdir -p r-reference-artifact
          Rscript tests/fixtures/mice_numeric_fcs/generate_mice_reference.R \
            tests/fixtures/mice_numeric_fcs/numeric_fcs.csv \
            r-reference-artifact/mice_numeric_fcs_reference.json

      - name: Set up Python for cross-tool comparison
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Missingly comparison dependencies
        run: pip install -e '.[test]'

      - name: Generate Missingly comparison evidence
        run: |
          python tests/fixtures/mice_numeric_fcs/generate_missingly_reference.py \
            tests/fixtures/mice_numeric_fcs/numeric_fcs.csv \
            r-reference-artifact/missingly_numeric_fcs_reference.json

      - name: Validate R evidence schema
        run: |
          python tests/fixtures/mice_numeric_fcs/validate_mice_reference.py \
            r-reference-artifact/mice_numeric_fcs_reference.json \
            tests/fixtures/mice_numeric_fcs/benchmark_manifest.json

      - name: Validate scoped Missingly versus R comparison
        run: |
          python tests/fixtures/mice_numeric_fcs/validate_cross_tool_comparison.py \
            r-reference-artifact/mice_numeric_fcs_reference.json \
            r-reference-artifact/missingly_numeric_fcs_reference.json \
            tests/fixtures/mice_numeric_fcs/cross_tool_contract.json

      - name: Upload R mice evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mice-numeric-fcs-reference
          path: r-reference-artifact/
          if-no-files-found: error
