<svg width="680" height="190" viewBox="0 0 680 190" xmlns="http://www.w3.org/2000/svg" role="img" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">پیشنهاد لوگوی ThinkFlow — مربع پایانی بدون برآمدگی</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">چهار مرحله‌ی رو به رشد: مرحله اول دو ضلع نقطه‌چین ناقص، مرحله دوم سه ضلع نقطه‌چین، مرحله سوم چهار ضلع نازک و صاف، و مرحله چهارم یک لوزی کاملاً بسته، ضخیم، تمیز و با پرشدگی ملایم آبی، بدون هیچ زائده‌ای. یک خط نازک همه مراحل را به هم وصل می‌کند. کنار آن وردمارک دو رنگ ThinkFlow آمده است.</desc>

<g transform="translate(40,10)" fill="none" style="fill:none;stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
