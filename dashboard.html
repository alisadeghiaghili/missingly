<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage Dashboard - DeepIntelligence</title>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'IRANSans';
            src: url('/irsans.ttf?v=20260727-vazirmatn') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'IRANSans';
            src: url('/irsansb.ttf?v=20260727-vazirmatn') format('truetype');
            font-weight: 700 900;
            font-style: normal;
            font-display: swap;
        }
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(45, 212, 191, 0.18), transparent 34%),
                radial-gradient(circle at 80% 0%, rgba(79, 70, 229, 0.18), transparent 30%),
                #070a12;
            color: #e2e8f0;
            font-family: 'IRANSans', Tahoma, system-ui, sans-serif;
        }

        .panel {
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 8px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
        }

        .metric {
            background: rgba(15, 23, 42, 0.68);
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 8px;
        }

        .bar-track {
            height: 8px;
            background: rgba(148, 163, 184, 0.16);
            border-radius: 999px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #2dd4bf, #6366f1);
            border-radius: inherit;
        }

        .nav-btn {
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            padding: 0.65rem 0.95rem;
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.62);
            transition: all 0.18s ease;
        }

        .nav-btn:hover {
            color: #f8fafc;
            border-color: rgba(45, 212, 191, 0.45);
            background: rgba(20, 184, 166, 0.12);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 0.85rem 0.75rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
            text-align: left;
            white-space: nowrap;
        }

        th {
            color: #99f6e4;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        td {
            color: #cbd5e1;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NFR2DLMB"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <main class="max-w-7xl mx-auto px-5 py-6">
        <header class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between mb-6">
            <div class="flex items-center gap-3">
                <img src="/thinkflow-logo.svg?v=20260731-1" alt="لوگوی ThinkFlow" class="h-11 w-40 object-contain rounded-md bg-white px-2 py-1">
                <div>
                    <h1 class="text-2xl font-bold text-white">Usage Dashboard</h1>
                    <p id="userLine" class="text-sm text-slate-400">Loading account usage...</p>
                </div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button id="appBtn" class="nav-btn">App</button>
                <button id="plansBtn" class="nav-btn">Plans</button>
                <button id="refreshBtn" class="nav-btn">Refresh</button>
            </div>
        </header>

        <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 mb-5">
            <article class="metric p-5">
                <p class="text-sm text-slate-400">Current Plan</p>
                <h2 id="planName" class="mt-2 text-3xl font-black text-white">-</h2>
            </article>
            <article class="metric p-5">
                <p class="text-sm text-slate-400">Requests Used / Remaining</p>
                <h2 id="requestsUsed" class="mt-2 text-3xl font-black text-white">-</h2>
                <div class="bar-track mt-4"><div id="requestBar" class="bar-fill" style="width: 0%"></div></div>
            </article>
            <article class="metric p-5">
                <p class="text-sm text-slate-400">Total Tokens</p>
                <h2 id="totalTokens" class="mt-2 text-3xl font-black text-white">-</h2>
            </article>
            <article class="metric p-5">
                <p class="text-sm text-slate-400">Token Counter</p>
                <h2 id="tokenCounter" class="mt-2 text-3xl font-black text-white">-</h2>
            </article>
        </section>

        <section class="grid grid-cols-1 xl:grid-cols-3 gap-5">
            <article class="panel p-5 xl:col-span-1">
                <h2 class="text-lg font-bold text-white mb-4">Tokens By Model</h2>
                <div id="modelUsage" class="space-y-4"></div>
            </article>

            <article class="panel p-5 xl:col-span-2 overflow-x-auto">
                <h2 class="text-lg font-bold text-white mb-4">Recent Requests</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Model</th>
                            <th>Type</th>
                            <th>Prompt</th>
                            <th>Output</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="recentRows"></tbody>
                </table>
            </article>
        </section>
    </main>

    <script>
        const token = sessionStorage.getItem('deepintelligence_token');
        const numberFormat = new Intl.NumberFormat('en-US');

        if (!token) {
            window.location.href = '/';
        }

        function fmt(value) {
            return numberFormat.format(Number(value || 0));
        }

        function shortDate(value) {
            if (!value) return '-';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleString();
        }

        async function loadUsage() {
            const response = await fetch('/usage/summary', {
                headers: { Authorization: `Bearer ${token}` }
            });
            if (response.status === 401) {
                sessionStorage.removeItem('deepintelligence_token');
                sessionStorage.removeItem('deepintelligence_user');
                window.location.href = '/';
                return;
            }
            if (!response.ok) throw new Error('Could not load usage data.');
            const data = await response.json();

            document.getElementById('userLine').textContent = `${data.user.name} - ${data.user.email}`;
            document.getElementById('planName').textContent = data.plan.name.toUpperCase();
            document.getElementById('requestsUsed').textContent = `${fmt(data.plan.requests_used)} used / ${fmt(data.plan.requests_remaining)} left`;
            document.getElementById('totalTokens').textContent = fmt(data.tokens.total);
            document.getElementById('tokenCounter').textContent = data.tokens.counter;

            const percent = Math.min(100, Math.round((data.plan.requests_used / Math.max(data.plan.request_limit, 1)) * 100));
            document.getElementById('requestBar').style.width = `${percent}%`;

            const modelUsage = document.getElementById('modelUsage');
            modelUsage.innerHTML = '';
            if (!data.by_model.length) {
                modelUsage.innerHTML = '<p class="text-slate-400 text-sm">No usage has been recorded yet.</p>';
            } else {
                const maxTokens = Math.max(...data.by_model.map(item => item.tokens), 1);
                data.by_model.forEach(item => {
                    const width = Math.max(4, Math.round((item.tokens / maxTokens) * 100));
                    const row = document.createElement('div');
                    row.innerHTML = `
                        <div class="flex items-center justify-between gap-3 text-sm mb-2">
                            <span class="text-slate-200 truncate">${item.model}</span>
                            <span class="text-slate-400">${fmt(item.tokens)}</span>
                        </div>
                        <div class="bar-track"><div class="bar-fill" style="width: ${width}%"></div></div>
                    `;
                    modelUsage.appendChild(row);
                });
            }

            const recentRows = document.getElementById('recentRows');
            recentRows.innerHTML = '';
            if (!data.recent.length) {
                recentRows.innerHTML = '<tr><td colspan="7" class="text-slate-400">No requests yet.</td></tr>';
            } else {
                data.recent.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${item.model}</td>
                        <td>${item.request_type}</td>
                        <td>${fmt(item.prompt_tokens)}</td>
                        <td>${fmt(item.completion_tokens)}</td>
                        <td class="text-white font-semibold">${fmt(item.total_tokens)}</td>
                        <td>${item.status}</td>
                        <td>${shortDate(item.created_at)}</td>
                    `;
                    recentRows.appendChild(row);
                });
            }
        }

        document.getElementById('appBtn').addEventListener('click', () => window.location.href = '/app');
        document.getElementById('plansBtn').addEventListener('click', () => window.location.href = '/pricing');
        document.getElementById('refreshBtn').addEventListener('click', loadUsage);
        loadUsage().catch(error => {
            document.getElementById('userLine').textContent = error.message;
        });
    </script>
</body>
</html>
