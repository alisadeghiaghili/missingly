  <meta name="thinkflow:prompt" content='Build a single-page hero landing page for a holistic wellness brand called "Vibrant Wellness." Use React, TypeScript, Tailwind CSS, and Lucide React icons. Load Google Fonts "Inter" (weights 300, 400, 500, 600, 700) via link tags in the HTML head. The entire page is a full-screen (100vh) section with a looping background video and liquid glass UI elements overlaid on top.

**BACKGROUND VIDEO**

Full-viewport autoplaying, looping, muted, playsInline video with `object-cover`, positioned absolute inset-0. Use this exact URL:
`https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260715_082433_69699cf8-444b-4484-93cc-053e57896dfd.mp4`

**LIQUID GLASS EFFECT**

Create a `.liquid-glass` CSS class applied to the nav pill, avatar circles, badge, and CTA button:
- `background: rgba(255,255,255,0.01)` with `background-blend-mode: luminosity`
- `backdrop-filter: blur(4px)` (with -webkit prefix)
- No border
- `box-shadow: inset 0 1px 1px rgba(255,255,255,0.1)`
- `position: relative; overflow: hidden`
- `::before` pseudo-element creating a gradient border: absolute inset-0, border-radius inherit, padding 1.4px, background is a vertical linear-gradient from rgba(255,255,255,0.45) at 0%, to 0.15 at 20%, transparent at 40-60%, back to 0.15 at 80% and 0.45 at 100%. Use the mask-composite exclude trick (`-webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude`) so the gradient only shows as a border. Set `pointer-events: none`.

**NAVIGATION (z-20, top)**

Flex row, justify-between, padding px-5 pt-6 / sm:px-8 sm:pt-8 / md:px-16 lg:px-20.
- Left: custom SVG logo (32x32, md:36x36), white fill, viewBox 0 0 256 256, path: `M 128 128 C 198.692 128 256 185.308 256 256 L 151.883 256 C 149.812 220.307 120.213 192 84 192 C 47.787 192 18.188 220.307 16.117 256 L 0 256 C 0 185.308 57.308 128 128 128 Z M 104.117 0 C 106.188 35.694 135.787 64 172 64 C 208.213 64 237.812 35.694 239.883 0 L 256 0 C 256 70.692 198.692 128 128 128 C 57.308 128 0 70.692 0 0 Z`
- Center (desktop only, hidden on mobile): liquid-glass rounded-full pill (px-8 py-3) with three links — "Home" (text-white), "Our Approach" and "Healing Methods" (text-white/70, hover:opacity-100). All text-sm font-medium.
- Right (desktop only): liquid-glass circle (h-10 w-10 rounded-full) containing Lucide `CircleUserRound` (h-5 w-5, text-white/80, strokeWidth 1.5).
- Right (mobile only, md:hidden): liquid-glass circle button (h-10 w-10 rounded-full, z-50). Animated icon swap between Lucide `Menu` and `X` using absolute positioning with rotate-90 scale-0 opacity-0 transitions (duration-300) toggled by a `menuOpen` state.

**MOBILE MENU OVERLAY (z-10, fixed inset-0, md:hidden)**

Toggle visibility with 500ms ease-out opacity transition. Background: black/80 with backdrop-blur-xl. Centered flex column (gap-8) with the same three nav links at text-2xl font-medium. Below links: liquid-glass avatar circle + "Account" text (text-sm font-light text-white/60). Links close the menu on click. Content slides from -translate-y-8 to 0.

**MAIN CONTENT (z-10)**

Flex column, justify-between, fills remaining viewport height. On mobile, fades to opacity-0 and pointer-events-none when menu is open.

Top block (mt-14 sm:mt-20 md:mt-28, max-w-2xl):
1. Badge — liquid-glass pill (rounded-full, inline-flex, gap-2.5 sm:gap-3, px-3 py-1.5 sm:px-4 sm:py-2, mb-5 sm:mb-6). Contains 4 overlapping avatars (flex -space-x-2, each h-5 w-5 sm:h-6 sm:w-6, rounded-full, border-2 border-white/20, object-cover) using these Pexels URLs:
   - `https://images.pexels.com/photos/774909/pexels-photo-774909.jpeg?auto=compress&cs=tinysrgb&w=100`
   - `https://images.pexels.com/photos/1222271/pexels-photo-1222271.jpeg?auto=compress&cs=tinysrgb&w=100`
   - `https://images.pexels.com/photos/1239291/pexels-photo-1239291.jpeg?auto=compress&cs=tinysrgb&w=100`
   - `https://images.pexels.com/photos/697509/pexels-photo-697509.jpeg?auto=compress&cs=tinysrgb&w=100`
   Followed by text "our path to natural wellness" (text-xs sm:text-sm, font-light, text-white/80).
2. Heading — `<h1>` "Heal Your Body" + `<br/>` + "Naturally". Style: text-4xl sm:text-5xl md:text-6xl lg:text-7xl, font-normal, leading-[1.05], text-white, inline letterSpacing -0.05em.
3. Subtitle — `<p>` "Holistic wellness. Transformative results." mt-4 sm:mt-5, text-sm sm:text-base md:text-lg, font-light, text-white/70.
4. CTA button — liquid-glass, rounded-full, px-6 py-3 sm:px-7 sm:py-3.5, mt-6 sm:mt-8, text-sm font-medium text-white, transition duration-300, hover:bg-white/10. Text: "Begin Your Journey".

**BOTTOM STATS (flex, items-end, gap-6 sm:gap-10 md:gap-16)**

Two stat columns:
1. First: a small triangular dot-pattern icon built from 9 absolutely-positioned 2.5px white/60 squares inside a 20x20 box; value "48 Hours" (text-xl sm:text-2xl md:text-3xl, font-normal, text-white); label "Initial Consultation" (text-xs sm:text-sm, font-light, text-white/60).
2. Second: a 3x3 grid icon (grid-cols-3, gap-[2px]) of 4px rounded cells alternating bg-white/60 and bg-white/0 in a checkerboard; value "Initial Consultation" (same sizing); label "Healing Sessions" (text-xs sm:text-sm, font-light, text-white/60).'>

  <style>
    /* Custom animations */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scale-in {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-fade-up {
      animation: fade-up 0.8s ease-out forwards;
      opacity: 0;
    }
    .animate-fade-up-delay-1 {
      animation: fade-up 0.8s ease-out 0.2s forwards;
      opacity: 0;
    }
    .animate-fade-up-delay-2 {
      animation: fade-up 0.8s ease-out 0.4s forwards;
      opacity: 0;
    }
    .animate-fade-up-delay-3 {
      animation: fade-up 0.8s ease-out 0.6s forwards;
      opacity: 0;
    }
    .animate-fade-up-delay-4 {
      animation: fade-up 0.8s ease-out 0.8s forwards;
      opacity: 0;
    }
    .animate-fade-in {
      animation: fade-in 0.8s ease-out forwards;
      opacity: 0;
    }
    .animate-fade-in-delay {
      animation: fade-in 0.8s ease-out 0.4s forwards;
      opacity: 0;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .animate-fade-up,
      .animate-fade-up-delay-1,
      .animate-fade-up-delay-2,
      .animate-fade-up-delay-3,
      .animate-fade-up-delay-4,
      .animate-fade-in,
      .animate-fade-in-delay {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }

    /* Video fallback */
    .video-fallback {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
    }
  </style>

<body class="font-inter bg-black text-white antialiased overflow-hidden">
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="/gallery/assets/vendor/react-18.3.1.min.js"></script>
  <script src="/gallery/assets/vendor/react-dom-18.3.1.min.js"></script>
  <script src="/gallery/assets/vendor/babel-7.26.4.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── Inline SVG Icons (lucide-react equivalents) ──
    const CrownIcon = ({ className = "w-4 h-4" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z" />
        <path d="M3 20h18" />
      </svg>
    );

    const ArrowUpRightIcon = ({ className = "w-4 h-4" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M7 17L17 7" />
        <path d="M7 7h10v10" />
      </svg>
    );

    const AwardIcon = ({ className = "w-8 h-8" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="8" r="7" />
        <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" />
      </svg>
    );

    const XIcon = ({ className = "w-8 h-8" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M18 6L6 18" />
        <path d="M6 6l12 12" />
      </svg>
    );

    // ── App Component ──
    function App() {
      const [menuOpen, setMenuOpen] = useState(false);

      const navLinks = ['Projects', 'Studio', 'Offerings', 'Inquire'];

      // Prevent body scroll when menu is open
      useEffect(() => {
        if (menuOpen) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }
        return () => { document.body.style.overflow = ''; };
      }, [menuOpen]);

      const closeMenu = () => setMenuOpen(false);

      return (
        <div className="relative h-screen w-screen overflow-hidden bg-black">
          {/* ── Background Video ── */}
          <video
            autoPlay
            muted
            loop
            playsInline
            className="absolute inset-0 w-full h-full object-cover"
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260606_154941_df1a96e1-a06f-450c-bd02-d863414cc1a0.mp4"
            onError={(e) => { e.target.style.display = 'none'; }}
          />
          {/* Subtle dark overlay for text readability */}
          <div className="absolute inset-0 bg-black/30 pointer-events-none" />

          {/* ── Navbar ── */}
          <nav className="absolute top-0 left-0 right-0 z-40 flex items-center justify-between px-6 sm:px-10 lg:px-16 py-5 lg:py-7">
            {/* Brand */}
            <a href="#" className="font-podium text-white font-bold uppercase text-2xl sm:text-3xl tracking-wider">
              VANGUARD
            </a>

            {/* Center nav links (md+) */}
            <div className="hidden md:flex items-center gap-8 lg:gap-10">
              {navLinks.map((link) => (
                <a
                  key={link}
                  href="#"
                  className="font-inter text-sm text-white/80 tracking-widest uppercase hover:text-white transition-colors duration-300"
                >
                  {link}
                </a>
              ))}
            </div>

            {/* Right: GET IN TOUCH (md+) */}
            <div className="hidden md:block">
              <a
                href="#"
                className="inline-flex items-center gap-2 border border-white/30 hover:border-white/60 px-6 py-3 text-xs tracking-widest uppercase text-white hover:bg-white/10 transition-all duration-300"
              >
                GET IN TOUCH
                <ArrowUpRightIcon className="w-3.5 h-3.5" />
              </a>
            </div>

            {/* Hamburger (below md) */}
            <button
              onClick={() => setMenuOpen(true)}
              className="md:hidden space-y-1.5 p-1"
              aria-label="Open menu"
            >
              <div className="w-6 h-0.5 bg-white"></div>
              <div className="w-6 h-0.5 bg-white"></div>
              <div className="w-4 h-0.5 bg-white"></div>
            </button>
          </nav>

          {/* ── Mobile Menu Overlay ── */}
          <div
            className={`fixed inset-0 z-50 flex flex-col bg-black/95 backdrop-blur-sm transition-all duration-500 ${
              menuOpen ? 'opacity-100 visible' : 'opacity-0 invisible'
            }`}
          >
            {/* Menu header */}
            <div className="flex items-center justify-between px-6 py-5 flex-shrink-0">
              <span className="font-podium text-white font-bold uppercase text-2xl tracking-wider">
                VANGUARD
              </span>
              <button onClick={closeMenu} aria-label="Close menu">
                <XIcon className="w-8 h-8 text-white" />
              </button>
            </div>

            {/* Menu links — centered */}
            <div className="flex-1 flex flex-col items-center justify-center gap-6 -mt-12">
              {navLinks.map((link, i) => (
                <a
                  key={link}
                  href="#"
                  onClick={closeMenu}
                  className="font-podium text-4xl sm:text-5xl text-white uppercase"
                  style={{
                    transitionDelay: `${i * 80 + 100}ms`,
                    opacity: menuOpen ? 1 : 0,
                    transform: menuOpen ? 'translateY(0)' : 'translateY(20px)',
                    transition: 'opacity 0.5s ease-out, transform 0.5s ease-out',
                  }}
                >
                  {link}
                </a>
              ))}
              <a
                href="#"
                onClick={closeMenu}
                className="inline-flex items-center gap-2 border border-white/30 hover:border-white/60 px-6 py-3 text-xs tracking-widest uppercase text-white hover:bg-white/10 transition-all duration-300 mt-4"
                style={{
                  transitionDelay: `${navLinks.length * 80 + 100}ms`,
                  opacity: menuOpen ? 1 : 0,
                  transform: menuOpen ? 'translateY(0)' : 'translateY(20px)',
                  transition: 'opacity 0.5s ease-out, transform 0.5s ease-out',
                }}
              >
                GET IN TOUCH
                <ArrowUpRightIcon className="w-3.5 h-3.5" />
              </a>
            </div>
          </div>

          {/* ── Hero Content ── */}
          <div className="relative z-10 flex items-center h-full px-6 sm:px-10 lg:px-16">
            <div>
              {/* Tagline */}
              <div className="animate-fade-up flex items-center gap-2 mb-6 lg:mb-8">
                <CrownIcon className="w-4 h-4 text-white/70" />
                <span className="text-white/70 text-xs sm:text-sm font-inter tracking-[0.3em] uppercase">
                  World-Class Digital Collective
                </span>
              </div>

              {/* Main Heading */}
              <h1 className="animate-fade-up-delay-1 font-podium text-white uppercase leading-[0.92] tracking-tight">
                <span className="block text-[clamp(2.8rem,8vw,7rem)]">Design.</span>
                <span className="block text-[clamp(2.8rem,8vw,7rem)]">Disrupt.</span>
                <span className="block text-[clamp(2.8rem,8vw,7rem)]">Conquer.</span>
              </h1>

              {/* Subtext */}
              <p className="animate-fade-up-delay-2 text-white/70 text-sm sm:text-base font-inter leading-relaxed max-w-md mt-6 lg:mt-8">
                We build fierce brand identities<br />
                that don't just turn heads —{' '}
                <span className="text-white font-bold">they lead.</span>
              </p>

              {/* CTA Row */}
              <div className="animate-fade-up-delay-3 mt-8 lg:mt-10 flex flex-wrap items-center gap-4 sm:gap-6">
                <a
                  href="#"
                  className="group inline-flex items-center gap-2 bg-black hover:bg-neutral-900 px-5 sm:px-7 py-3 sm:py-4 text-[11px] sm:text-xs tracking-widest uppercase text-white transition-colors duration-300"
                >
                  SEE OUR WORK
                  <ArrowUpRightIcon className="w-3.5 h-3.5 transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5" />
                </a>

                {/* Award badge (sm+) */}
                <div className="hidden sm:flex items-center gap-3">
                  <AwardIcon className="w-8 h-8 text-white/50" />
                  <div className="text-white/60 text-xs tracking-wider uppercase leading-tight">
                    <div>Top-Rated</div>
                    <div>Brand Studio</div>
                  </div>
                </div>
              </div>

              {/* Stats Row */}
              <div className="animate-fade-up-delay-4 mt-8 sm:mt-10 lg:mt-14 flex flex-wrap gap-6 sm:gap-12 lg:gap-16">
                <div>
                  <div className="font-inter text-white font-bold text-2xl sm:text-4xl lg:text-5xl tracking-tight">
                    250+
                  </div>
                  <div className="text-white/50 text-[9px] sm:text-xs tracking-widest uppercase mt-1">
                    Brands Transformed
                  </div>
                </div>
                <div>
                  <div className="font-inter text-white font-bold text-2xl sm:text-4xl lg:text-5xl tracking-tight">
                    95%
                  </div>
                  <div className="text-white/50 text-[9px] sm:text-xs tracking-widest uppercase mt-1">
                    Client Retention
                  </div>
                </div>
                <div>
                  <div className="font-inter text-white font-bold text-2xl sm:text-4xl lg:text-5xl tracking-tight">
                    10+
                  </div>
                  <div className="text-white/50 text-[9px] sm:text-xs tracking-widest uppercase mt-1">
                    Years in the Game
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── Mount ──
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
