<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>3D particle planet · interactive hero</title>

  <meta name="thinkflow:prompt" content='Building interactive 3D animations used to require deep WebGL knowledge, custom shaders, and hours of debugging. But lucky for us, not anymore.

With AI-powered coding tools, you can drop a stunning 3D particle system into your site with a single prompt and some borrowed code.

I&#39;m going to show you how I added this interactive 3D planet animation to a homepage using [Builder.io Fusion](http://fusion.builder.io/), but this technique works with pretty much any AI coding tool that can handle visual updates.'>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0b0b12;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* canvas fills screen */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ----- glass-morphism overlay (UI) ----- */
    .hero-overlay {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      padding: 2rem 2.5rem 3rem;
      pointer-events: none; /* let clicks pass to canvas if needed, but we want buttons clickable */
    }
    /* make interactive elements clickable */
    .hero-overlay a,
    .hero-overlay button,
    .hero-overlay .clickable {
      pointer-events: auto;
    }

    /* glass panel */
    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px) saturate(1.2);
      -webkit-backdrop-filter: blur(12px) saturate(1.2);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* ----- nav bar ----- */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.75rem;
      pointer-events: auto;
      transition: all 0.2s;
    }
    .logo {
      font-weight: 600;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f0e9ff, #b7a9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-links {
      display: flex;
      gap: 2.5rem;
      font-weight: 450;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.7);
    }
    .nav-links a {
      color: inherit;
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-links a:hover {
      color: #fff;
    }
    .nav-cta {
      background: rgba(255,255,255,0.08);
      padding: 0.45rem 1.4rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.85rem;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.05);
      transition: background 0.2s;
      cursor: default;
    }
    .nav-cta:hover {
      background: rgba(255,255,255,0.14);
    }

    /* ----- main hero text ----- */
    .hero-content {
      max-width: 720px;
      margin-bottom: 4rem;
      pointer-events: none;
    }
    .hero-content h1 {
      font-size: clamp(2.8rem, 12vw, 5.8rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.03em;
      background: linear-gradient(to right, #ffffff 30%, #b7a9ff 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(130, 100, 255, 0.15);
    }
    .hero-content p {
      margin-top: 0.8rem;
      font-size: 1.15rem;
      font-weight: 350;
      color: rgba(255,255,255,0.7);
      max-width: 500px;
      letter-spacing: 0.01em;
    }
    .hero-actions {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      pointer-events: auto;
    }
    .btn-primary {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.8rem 2.2rem;
      border-radius: 60px;
      font-weight: 500;
      color: #fff;
      font-size: 1rem;
      transition: all 0.2s;
      cursor: pointer;
      box-shadow: 0 8px 20px -8px rgba(0,0,0,0.4);
    }
    .btn-primary:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.25);
      transform: scale(1.02);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.8rem 2.2rem;
      border-radius: 60px;
      font-weight: 400;
      color: rgba(255,255,255,0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: all 0.2s;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.05);
      color: #fff;
    }

    /* bottom tag */
    .bottom-tag {
      display: flex;
      justify-content: flex-end;
      pointer-events: none;
    }
    .bottom-tag span {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.02);
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.03);
    }

    /* responsive */
    @media (max-width: 680px) {
      .hero-overlay { padding: 1.2rem 1.2rem 2rem; }
      .navbar { padding: 0.5rem 1rem; flex-wrap: wrap; gap: 0.5rem; }
      .nav-links { display: none; }
      .hero-content h1 { font-size: 2.8rem; }
      .hero-content p { font-size: 1rem; }
      .btn-primary, .btn-secondary { padding: 0.6rem 1.5rem; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <!-- Three.js container -->
  <div id="canvas-container"></div>

  <!-- UI Overlay with glass morphism -->
  <div class="hero-overlay">
    <!-- navbar glass -->
    <div class="glass navbar">
      <span class="logo">✦ planet</span>
      <div class="nav-links">
        <a href="#">explore</a>
        <a href="#">journey</a>
        <a href="#">about</a>
      </div>
      <span class="nav-cta">launch</span>
    </div>

    <!-- center hero -->
    <div class="hero-content">
      <h1>interstellar<br/>particle world</h1>
      <p>3D planet built from thousands of glowing particles. Interactive, ethereal, and alive.</p>
      <div class="hero-actions">
        <button class="btn-primary">explore now</button>
        <button class="btn-secondary">watch demo</button>
      </div>
    </div>

    <!-- bottom right -->
    <div class="bottom-tag">
      <span>✦ three.js · particle system</span>
    </div>
  </div>

  <!-- ============ Three.js ============ -->
  <script type="importmap">
    {
      "imports": {
        "three": "/gallery/assets/vendor/three-r128.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from '/gallery/assets/vendor/OrbitControls-r128.module.js';

    // --- setup ---
    const container = document.getElementById('canvas-container');
    const width = container.clientWidth;
    const height = container.clientHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0b12);

    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(0, 1.2, 5.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // subtle controls (optional, but adds interactivity)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.04;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.enableZoom = true;
    controls.zoomSpeed = 0.6;
    controls.enablePan = false;
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.minPolarAngle = 0.2;
    controls.target.set(0, 0.1, 0);

    // ----- particle planet -----
    const particleCount = 12000;
    const radius = 1.9;

    // geometry with positions & colors
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    // color palettes: blues, purples, whites
    const color1 = new THREE.Color(0x5a6cff);
    const color2 = new THREE.Color(0x8a6cff);
    const color3 = new THREE.Color(0xb7a9ff);
    const color4 = new THREE.Color(0xffffff);

    for (let i = 0; i < particleCount; i++) {
      // spherical distribution with some randomness
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      
      // slight radius variation for cloud-like feel
      const r = radius * (0.85 + 0.2 * Math.random());
      
      const x = r * Math.sin(phi) * Math.cos(theta);
      const y = r * Math.sin(phi) * Math.sin(theta);
      const z = r * Math.cos(phi);
      
      positions[i*3] = x;
      positions[i*3+1] = y;
      positions[i*3+2] = z;
      
      // color based on position
      const mixVal = (y / radius) * 0.6 + 0.4;
      const rand = Math.random();
      let baseColor;
      if (rand < 0.4) baseColor = color1.clone().lerp(color2, Math.random());
      else if (rand < 0.7) baseColor = color2.clone().lerp(color3, Math.random());
      else baseColor = color3.clone().lerp(color4, 0.5 + Math.random()*0.5);
      
      // add some variation
      baseColor.multiplyScalar(0.7 + 0.5 * Math.random());
      
      colors[i*3] = baseColor.r;
      colors[i*3+1] = baseColor.g;
      colors[i*3+2] = baseColor.b;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // particle texture (soft circle)
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.4, 'rgba(255,255,255,0.9)');
    gradient.addColorStop(0.7, 'rgba(210,210,255,0.6)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);
    const texture = new THREE.CanvasTexture(canvas);

    const material = new THREE.PointsMaterial({
      size: 0.08,
      map: texture,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      vertexColors: true,
      transparent: true,
      opacity: 0.92,
    });

    const particleSystem = new THREE.Points(geometry, material);
    particleSystem.position.y = 0.1;
    scene.add(particleSystem);

    // add a faint inner glow (smaller particles)
    const innerGeo = new THREE.BufferGeometry();
    const innerPos = new Float32Array(3000 * 3);
    for (let i = 0; i < 3000; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      const r = radius * (0.3 + 0.5 * Math.random());
      innerPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
      innerPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      innerPos[i*3+2] = r * Math.cos(phi);
    }
    innerGeo.setAttribute('position', new THREE.BufferAttribute(innerPos, 3));
    const innerMat = new THREE.PointsMaterial({
      size: 0.05,
      color: 0x8a7aff,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.3,
      depthWrite: false,
    });
    const innerParticles = new THREE.Points(innerGeo, innerMat);
    innerParticles.position.y = 0.1;
    scene.add(innerParticles);

    // ambient glow / star field background
    const starGeo = new THREE.BufferGeometry();
    const starCount = 2000;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 15 + Math.random() * 30;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
      starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      starPos[i*3+2] = r * Math.cos(phi);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.12,
      transparent: true,
      opacity: 0.4,
      blending: THREE.AdditiveBlending,
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // subtle rotating ring (extra flair)
    const ringGeo = new THREE.TorusGeometry(2.2, 0.02, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x6a5cff,
      transparent: true,
      opacity: 0.12,
      wireframe: false,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2.8;
    ring.rotation.z = 0.3;
    ring.position.y = 0.1;
    scene.add(ring);

    const ring2 = new THREE.TorusGeometry(2.5, 0.015, 16, 100);
    const ringMat2 = new THREE.MeshBasicMaterial({
      color: 0x8a7aff,
      transparent: true,
      opacity: 0.08,
    });
    const ringMesh2 = new THREE.Mesh(ring2, ringMat2);
    ringMesh2.rotation.x = Math.PI / 2.2;
    ringMesh2.rotation.z = -0.2;
    ringMesh2.position.y = 0.1;
    scene.add(ringMesh2);

    // ----- animation loop -----
    let clock = new THREE.Clock();

    function animate() {
      const delta = clock.getDelta();
      const elapsedTime = performance.now() / 1000;

      // auto-rotate via controls
      controls.update();

      // gentle particle pulse
      const pulse = Math.sin(elapsedTime * 0.3) * 0.02 + 0.08;
      material.size = pulse;
      
      // rotate stars slowly
      stars.rotation.y += 0.0002;
      stars.rotation.x += 0.00005;
      
      // rotate rings
      ring.rotation.y += 0.001;
      ringMesh2.rotation.y += 0.0008;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // ----- resize handler -----
    function onResize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', onResize);
    // also observe container
    const ro = new ResizeObserver(() => onResize());
    ro.observe(container);

    // small fix: on load ensure size
    setTimeout(onResize, 20);
  </script>
</body>
</html>
